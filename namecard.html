<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>名醫診所系統 - 雙面卡片設計</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; background: #E5E7EB; }
    .font-serif { font-family: 'Noto Serif TC', serif; }
    .card-size {
      width: 90mm;
      height: 54mm;
      box-sizing: border-box;
    }
    @media print {
      body { background: transparent; padding: 0; }
      .no-print { display: none; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 gap-8">

  <div class="no-print text-center text-gray-600 text-sm">
    <p class="font-semibold text-base text-gray-800">名醫診所系統卡片預覽（90mm × 54mm）</p>
    <p class="text-xs text-gray-500 mt-1">副標語已更新：專為中醫量身打造的管理方案</p>
  </div>

  <div class="flex flex-wrap items-center justify-center gap-8">
    
    <!-- 正面 (Front) -->
    <div class="card-size bg-[#F6EFE8] rounded-xl shadow-xl p-5 flex flex-col justify-between border border-[#E8DED5] relative overflow-hidden">
      <!-- 柔和裝飾背景光暈 -->
      <div class="absolute -right-8 -top-8 w-28 h-28 rounded-full bg-[#D9782B] opacity-10 blur-xl"></div>
      
      <!-- 頂部：診所 LOGO + 系統名稱 -->
      <div class="flex items-center gap-2.5">
        <div class="w-6 h-6 rounded-lg overflow-hidden flex items-center justify-center bg-white/70 shadow-xs border border-[#D9782B]/20">
          <img src="images/myLogo.png" alt="名醫診所系統 Logo" class="w-full h-full object-contain" onerror="this.src='https://drgreattcm.com/images/myLogo.png';">
        </div>
        <span class="font-serif font-bold text-[13px] tracking-wider text-[#1E1E1E]">名醫診所系統</span>
      </div>

      <!-- 中間標語 -->
      <div class="text-center my-auto">
        <div class="font-serif text-[21px] font-bold tracking-[0.22em] text-[#1E1E1E] pl-1">
          簡便 · 易用 · 高效
        </div>
        <div class="w-14 h-[1.5px] bg-[#D9782B] mx-auto my-2 opacity-60"></div>
        <p class="text-[9.5px] text-[#8E4E19] tracking-wider font-medium">專為中醫量身打造的管理方案</p>
      </div>

      <!-- 底部聯絡資訊 -->
      <div class="pt-2 border-t border-[#D9782B]/20 text-[9px] text-[#555] flex justify-between items-end">
        <div class="space-y-0.5">
          <p class="tracking-wide">✉ drgreattcm@gmail.com</p>
          <p class="tracking-wide">📞 +852 54393401 (WhatsApp)</p>
        </div>
        <div class="text-right">
          <p class="font-semibold text-[#D9782B] text-[9.5px] tracking-wide">drgreattcm.com</p>
        </div>
      </div>
    </div>

    <!-- 背面 (Back - 12項純文字功能) -->
    <div class="card-size bg-[#1E1E1E] text-white rounded-xl shadow-xl p-5 flex flex-col justify-between relative overflow-hidden border border-gray-800">
      
      <!-- 頂部標題列 -->
      <div class="flex justify-between items-center border-b border-white/10 pb-2">
        <span class="font-serif text-[11px] font-semibold tracking-widest text-[#E6A67C]">核心功能模組</span>
        <span class="text-[8.5px] text-gray-400 tracking-wider">全方位中醫數位化</span>
      </div>

      <!-- 3 × 4 純文字方塊矩陣 -->
      <div class="grid grid-cols-3 gap-2 my-auto text-[10px]">
        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">診症系統</div>
        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">電子病歷</div>
        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">藥房庫存</div>

        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">套票系統</div>
        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">財務報表</div>
        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">自動備份</div>

        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">線上掛號</div>
        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">視像診症</div>
        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">病歷附件</div>

        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">會員系統</div>
        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">安全保障</div>
        <div class="bg-white/5 border border-white/10 rounded py-1.5 text-center font-medium text-gray-200 tracking-wider">排程報表</div>
      </div>

      <!-- 底部細字輔助 -->
      <div class="text-[8px] text-gray-400 text-center border-t border-white/10 pt-1.5 tracking-widest">
        跨平台支援 · 診所數據自主保管
      </div>
    </div>

  </div>
</body>
</html>
